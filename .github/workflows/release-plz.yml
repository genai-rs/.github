# Reusable release workflow for genai-rs Rust crates.
#
# On main, release-plz opens or updates the release PR, and publishes every
# crate whose version is not on crates.io yet: merging the release PR publishes.
# Dispatched from another branch, it only checks that a release would succeed.
#
# The caller's .github/workflows/release-plz.yml:
#
#   name: Release-plz
#   on:
#     push: { branches: [main] }
#     workflow_dispatch:
#   permissions:
#     contents: write
#     pull-requests: write
#   jobs:
#     release-plz:
#       uses: genai-rs/.github/.github/workflows/release-plz.yml@main
#       secrets: inherit
#
# Secrets: BOT_APP_ID and BOT_PRIVATE_KEY (a GitHub App, so the release PR's
# pushes trigger CI) and CARGO_REGISTRY_TOKEN.
name: Release-plz

on:
  workflow_call:
    secrets:
      BOT_APP_ID:
        required: true
      BOT_PRIVATE_KEY:
        required: true
      CARGO_REGISTRY_TOKEN:
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-plz:
    name: Release-plz
    runs-on: ubuntu-latest
    # One release at a time per repository; a publish in progress is never cancelled.
    concurrency:
      group: release-plz-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz
        uses: MarcoIeni/release-plz-action@v0.5
        with:
          command: ${{ github.ref != 'refs/heads/main' && 'release' || '' }}
          dry_run: ${{ github.ref != 'refs/heads/main' && 'true' || '' }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
