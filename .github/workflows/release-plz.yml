# Reusable release workflow for genai-rs Rust crates.
#
# On main, one job publishes every crate whose version is not on crates.io yet,
# and another opens or updates the release PR: merging the release PR publishes.
# Only the publishing job can publish: it gets the OIDC token for crates.io
# Trusted Publishing, or the CARGO_REGISTRY_TOKEN secret where one is still
# set. Dispatched from another branch, it only checks that a release would
# succeed (release --dry-run).
#
# The caller's .github/workflows/release-plz.yml:
#
#   name: Release-plz
#   on:
#     push: { branches: [main] }
#     workflow_dispatch:
#   permissions:
#     contents: write
#     pull-requests: write
#     id-token: write
#   jobs:
#     release-plz:
#       uses: genai-rs/.github/.github/workflows/release-plz.yml@main
#       secrets: inherit
#
# Secrets: BOT_APP_ID and BOT_PRIVATE_KEY (a GitHub App, so the release PR's
# pushes trigger CI). CARGO_REGISTRY_TOKEN only until the repo's crates trust
# this workflow on crates.io (docs/trusted-publishing.md).
name: Release-plz

on:
  workflow_call:
    secrets:
      BOT_APP_ID:
        required: true
      BOT_PRIVATE_KEY:
        required: true
      # Only for a repo that does not publish through Trusted Publishing (yet).
      CARGO_REGISTRY_TOKEN:
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  # Publishes what crates.io does not have yet; on another branch, a dry run.
  # The only job that can publish.
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # The OIDC token crates.io Trusted Publishing checks.
      id-token: write
    env:
      HAS_CARGO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    # A publish in progress is never cancelled.
    concurrency:
      group: release-plz-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Without a CARGO_REGISTRY_TOKEN secret, release-plz publishes through
      # crates.io Trusted Publishing: it trades the job's OIDC token for a
      # short-lived crates.io token (docs/trusted-publishing.md).
      - name: Run release-plz release (Trusted Publishing)
        if: env.HAS_CARGO_TOKEN != 'true'
        uses: MarcoIeni/release-plz-action@v0.5
        with:
          command: release
          # Empty, not 'false', on main: the action treats any non-empty value as a dry run.
          dry_run: ${{ github.ref != 'refs/heads/main' && 'true' || '' }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Run release-plz release (token)
        if: env.HAS_CARGO_TOKEN == 'true'
        uses: MarcoIeni/release-plz-action@v0.5
        with:
          command: release
          dry_run: ${{ github.ref != 'refs/heads/main' && 'true' || '' }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Opens or updates the release PR, on main only. No crates.io token.
  release-pr:
    name: Release PR
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz release-pr
        uses: MarcoIeni/release-plz-action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
