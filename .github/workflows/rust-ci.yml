# Reusable CI workflow for genai-rs Rust crates.
#
# Call it from a repo with:
#
#   jobs:
#     ci:
#       permissions: { contents: read, issues: write, actions: read }
#       uses: genai-rs/.github/.github/workflows/rust-ci.yml@main
#       with: { msrv: "1.88" }
#       secrets: inherit
#
# Run it on push to main and on pull_request with the default activity types,
# not on labeled/unlabeled: label runs on the same commit cancel each other and
# can leave a required check cancelled (docs/rust-ci.md, "Triggers and
# concurrency").
#
# Job names are stable so they can be used as required status checks:
#   fmt, clippy (stable), clippy (msrv), test (<os>, stable), test (<os>, msrv),
#   doc, semver-checks, coverage, and `wasm` when `wasm-test-args` or
#   `wasm-clippy-args` is set (opt-in; not meant to be a required check).
# The msrv entries resolve to `inputs.msrv` at run time; the check name stays
# "msrv" so bumping the MSRV never breaks branch protection.
#
# The `gate` job decides how much heavy work a commit needs (see
# local-ci-gate.yml, whose logic it mirrors):
#   full      push to main, fork PRs, PRs without attestation: everything runs,
#             except that on PRs the macOS and Windows test entries are skipped
#             (they run on main, or on PRs labelled `full-ci`);
#   local-ci  same-repo PR whose head commit carries a successful `local-ci`
#             commit status (posted by scripts/local-ci.sh): heavy jobs skip;
# and on every PR but a release one, `test (windows-latest, stable)` runs
# whatever the mode: no author's machine tests Windows.
#   release   release-plz PR touching only Cargo.toml/Cargo.lock/CHANGELOG.md:
#             heavy jobs skip, `release-sanity` runs cargo check + package
#             (every publishable member of the workspace together).
# Heavy jobs skip at step level, so every matrix entry still reports its
# expanded check name with a passing conclusion, on an ubuntu runner.
#
# On main (push, schedule, dispatch), `main-status` opens an issue "CI is
# failing on main" in the calling repo when a job failed, comments on it while
# it stays red, and closes it at the next green run. That is what the
# permissions above are for: a caller that grants less fails to start.
name: Rust CI

on:
  workflow_call:
    inputs:
      msrv:
        description: Minimum supported Rust version (e.g. "1.88")
        required: true
        type: string
      features:
        description: Cargo feature flags passed to clippy/test/doc
        required: false
        type: string
        default: --all-features
      run-semver-checks:
        description: Run cargo-semver-checks against the latest published release
        required: false
        type: boolean
        default: true
      run-coverage:
        description: Run cargo-llvm-cov and upload to Codecov
        required: false
        type: boolean
        default: true
      run-doc:
        description: Build docs with RUSTDOCFLAGS=-D warnings (disable where rustdoc OOMs)
        required: false
        type: boolean
        default: true
      generated-crate:
        description: Generated client crate; skips semver-checks and coverage
        required: false
        type: boolean
        default: false
      os-matrix:
        description: JSON array of runner labels for the test matrix
        required: false
        type: string
        default: '["ubuntu-latest","macos-latest","windows-latest"]'
      wasm-clippy-args:
        description: >-
          Clippy runs for wasm32-unknown-unknown, one per line, each line being the
          arguments of `cargo clippy --target wasm32-unknown-unknown <line> -- -D warnings`
          (e.g. "--no-default-features --lib --test wasm"). Empty (default): none.
        required: false
        type: string
        default: ""
      wasm-test-args:
        description: >-
          wasm-bindgen-test runs in Node.js, one per line, each line being the arguments of
          `cargo test --target wasm32-unknown-unknown <line>` with wasm-bindgen-test-runner
          as the runner (e.g. "--no-default-features --test wasm"). wasm-bindgen-cli is
          installed at the `wasm-bindgen` version in Cargo.lock. Empty (default): none.
        required: false
        type: string
        default: ""
      local-ci-wait-seconds:
        description: How long the gate waits for a `local-ci` commit status on same-repo PRs
        required: false
        type: number
        default: 60

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.gate.outputs.mode }}
      heavy: ${{ steps.gate.outputs.heavy }}
      all-os: ${{ steps.gate.outputs.all-os }}
      pr-windows: ${{ steps.gate.outputs.pr-windows }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - name: Decide CI mode
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          FULL_CI_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          WAIT_SECONDS: ${{ inputs.local-ci-wait-seconds }}
        run: |
          set -uo pipefail
          mode=full
          all_os=true
          reason="$EVENT event: full CI"

          release_files_only() {
            local files
            files=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename') || return 1
            [ -n "$files" ] || return 1
            ! printf '%s\n' "$files" | grep -Evq '(^|/)(Cargo\.toml|Cargo\.lock|CHANGELOG\.md)$'
          }

          # Latest `local-ci` status on HEAD_SHA, ignoring statuses created by
          # workflows (GITHUB_TOKEN) so CI can never attest itself. Creating a
          # status requires write access to this repository.
          local_ci_state() {
            local out
            if ! out=$(gh api "repos/$REPO/commits/$HEAD_SHA/statuses?per_page=100" \
              --jq '[.[] | select(.context == "local-ci" and .creator.login != "github-actions[bot]")][0] | "\(.state) \(.creator.login) \(.description)"' 2>&1); then
              echo "::warning::cannot read commit statuses: $out" >&2
              return 1
            fi
            printf '%s' "$out" | tr -d '\r' | tr '\n' ' '
          }

          # Read the full-ci label now rather than only from the event payload:
          # callers do not run CI on `labeled` events (docs/gate.md), and a
          # re-run replays the payload of the original event. Labelling a PR
          # full-ci therefore takes effect on "Re-run all jobs" or the next push.
          if [ "$EVENT" = "pull_request" ] && [ "$FULL_CI_LABEL" != "true" ] \
            && gh api "repos/$REPO/issues/$PR_NUMBER/labels" --jq '.[].name' 2>/dev/null | grep -qx 'full-ci'; then
            FULL_CI_LABEL=true
          fi

          if [ "$EVENT" = "pull_request" ]; then
            all_os=false
            reason="pull request: full CI on Linux, plus the stable tests on Windows; the other macOS/Windows entries only on main (label 'full-ci' to force)"
            if [ "$FULL_CI_LABEL" = "true" ]; then
              all_os=true
              reason="pull request labelled full-ci: full CI on all OSes"
            elif [ "$HEAD_REPO" != "$REPO" ]; then
              reason="fork pull request: full CI on Linux, plus the stable tests on Windows; the other macOS/Windows entries only on main"
            elif [[ "$PR_AUTHOR" == "genai-ci-bot[bot]" && ( "$HEAD_REF" == release-plz-* || "$HEAD_REF" == automated/release-plz/* ) ]] && release_files_only; then
              mode=release
              reason="release-plz PR touching only Cargo.toml/Cargo.lock/CHANGELOG.md: heavy jobs skipped"
            else
              deadline=$((SECONDS + WAIT_SECONDS))
              while :; do
                status=$(local_ci_state || true)
                state=${status%% *}
                if [ "$state" = "success" ]; then
                  mode=local-ci
                  reason="local-ci attested ${HEAD_SHA}: ${status#* }; heavy jobs skipped, except the stable tests on Windows"
                  break
                fi
                if [ "$SECONDS" -ge "$deadline" ]; then
                  break
                fi
                sleep 10
              done
            fi
          fi

          heavy=false
          [ "$mode" = "full" ] && heavy=true
          # Windows is the one OS nobody's own machine tests: its stable test
          # entry runs on every pull request, attested by local-ci or not.
          pr_windows=false
          if [ "$EVENT" = "pull_request" ] && [ "$mode" != "release" ]; then
            pr_windows=true
          fi
          echo "mode=$mode heavy=$heavy all-os=$all_os pr-windows=$pr_windows"
          echo "$reason"
          echo "::notice title=CI mode $mode::$reason"
          {
            echo "mode=$mode"
            echo "heavy=$heavy"
            echo "all-os=$all_os"
            echo "pr-windows=$pr_windows"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.toolchain }})
    needs: gate
    # Run (fail-open) even if the gate job itself failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN: ${{ needs.gate.outputs.heavy != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, msrv]
    steps:
      - name: Skip (${{ needs.gate.outputs.mode }})
        if: env.RUN != 'true'
        env:
          MODE: ${{ needs.gate.outputs.mode }}
          REASON: ${{ needs.gate.outputs.reason }}
        run: |
          echo "Skipped - $REASON"
          echo "**Skipped by the gate** (mode \`$MODE\`): this job built and tested nothing. $REASON" >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout repository
        if: env.RUN == 'true'
        uses: actions/checkout@v7
      - name: Install Rust
        if: env.RUN == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain == 'msrv' && inputs.msrv || 'stable' }}
          components: clippy
      - name: Cache dependencies
        if: env.RUN == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
      - name: Run clippy
        if: env.RUN == 'true'
        run: cargo clippy --all-targets ${{ inputs.features }} -- -D warnings

  test:
    name: test (${{ matrix.os }}, ${{ matrix.toolchain }})
    needs: gate
    if: ${{ !cancelled() }}
    # An entry runs when the gate asks for heavy work on its OS, and the stable
    # Windows entry on every pull request (pr-windows). Skipped entries run
    # their no-op on ubuntu, so they never wait for a macOS/Windows runner.
    runs-on: ${{ ((needs.gate.outputs.heavy != 'false' && (startsWith(matrix.os, 'ubuntu') || needs.gate.outputs.all-os != 'false')) || (needs.gate.outputs.pr-windows == 'true' && startsWith(matrix.os, 'windows') && matrix.toolchain == 'stable')) && matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      RUN: ${{ (needs.gate.outputs.heavy != 'false' && (startsWith(matrix.os, 'ubuntu') || needs.gate.outputs.all-os != 'false')) || (needs.gate.outputs.pr-windows == 'true' && startsWith(matrix.os, 'windows') && matrix.toolchain == 'stable') }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os-matrix) }}
        toolchain: [stable, msrv]
    steps:
      - name: Skip (${{ needs.gate.outputs.mode }})
        if: env.RUN != 'true'
        env:
          MODE: ${{ needs.gate.outputs.mode }}
          REASON: ${{ needs.gate.outputs.reason }}
        run: |
          echo "Skipped - $REASON"
          echo "**Skipped by the gate** (mode \`$MODE\`): this job built and tested nothing. $REASON" >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout repository
        if: env.RUN == 'true'
        uses: actions/checkout@v7
      - name: Install Rust
        if: env.RUN == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain == 'msrv' && inputs.msrv || 'stable' }}
      - name: Cache dependencies
        if: env.RUN == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
      - name: Build
        if: env.RUN == 'true'
        run: cargo build --verbose ${{ inputs.features }}
      # `cargo test` also compiles examples and runs doc tests.
      - name: Run tests
        if: env.RUN == 'true'
        run: cargo test --verbose ${{ inputs.features }}

  doc:
    name: doc
    needs: gate
    if: ${{ !cancelled() && inputs.run-doc }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN: ${{ needs.gate.outputs.heavy != 'false' }}
    steps:
      - name: Skip (${{ needs.gate.outputs.mode }})
        if: env.RUN != 'true'
        env:
          MODE: ${{ needs.gate.outputs.mode }}
          REASON: ${{ needs.gate.outputs.reason }}
        run: |
          echo "Skipped - $REASON"
          echo "**Skipped by the gate** (mode \`$MODE\`): this job built and tested nothing. $REASON" >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout repository
        if: env.RUN == 'true'
        uses: actions/checkout@v7
      - name: Install Rust
        if: env.RUN == 'true'
        uses: dtolnay/rust-toolchain@stable
      - name: Cache dependencies
        if: env.RUN == 'true'
        uses: Swatinem/rust-cache@v2
      - name: Build documentation
        if: env.RUN == 'true'
        run: cargo doc --no-deps ${{ inputs.features }}
        env:
          RUSTDOCFLAGS: -D warnings

  semver-checks:
    name: semver-checks
    needs: gate
    if: ${{ !cancelled() && inputs.run-semver-checks && !inputs.generated-crate }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUN: ${{ needs.gate.outputs.heavy != 'false' }}
    steps:
      - name: Skip (${{ needs.gate.outputs.mode }})
        if: env.RUN != 'true'
        env:
          MODE: ${{ needs.gate.outputs.mode }}
          REASON: ${{ needs.gate.outputs.reason }}
        run: |
          echo "Skipped - $REASON"
          echo "**Skipped by the gate** (mode \`$MODE\`): this job built and tested nothing. $REASON" >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout repository
        if: env.RUN == 'true'
        uses: actions/checkout@v7
      - name: Install Rust
        if: env.RUN == 'true'
        uses: dtolnay/rust-toolchain@stable
      # A crate that was never released has nothing to compare with: leave it out
      # until its first release, and skip the check when no crate is left.
      - name: Find crates not released yet
        id: unpublished
        if: env.RUN == 'true'
        run: |
          curl -fsSL --retry 3 \
            https://raw.githubusercontent.com/genai-rs/.github/main/scripts/unpublished-crates.sh \
            -o "$RUNNER_TEMP/unpublished-crates.sh"
          unpublished=$(bash "$RUNNER_TEMP/unpublished-crates.sh")
          published=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.publish == null or (.publish | length) > 0) | .name' |
            grep -vxF -f <(printf '%s\n' "$unpublished") || true)
          if [ -n "$unpublished" ]; then
            echo "Not released yet, left out: $(printf '%s' "$unpublished" | paste -sd' ' -)"
          fi
          echo "exclude=$(printf '%s' "$unpublished" | paste -sd, -)" >> "$GITHUB_OUTPUT"
          echo "any=$([ -n "$published" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Check semver compatibility
        if: env.RUN == 'true' && steps.unpublished.outputs.any == 'true'
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          exclude: ${{ steps.unpublished.outputs.exclude }}

  coverage:
    name: coverage
    needs: gate
    # Not a required check: skipped entirely when the gate skips heavy work.
    if: ${{ !cancelled() && inputs.run-coverage && !inputs.generated-crate && needs.gate.outputs.heavy != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Informational only: never block a merge on coverage tooling.
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov ${{ inputs.features }} --lcov --output-path lcov.info
      # Requires `secrets: inherit` on the caller so CODECOV_TOKEN is available.
      - name: Upload to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # Opt-in WebAssembly job: clippy and wasm-bindgen-test (Node.js) for
  # wasm32-unknown-unknown. Heavy: skipped at step level when the gate says so
  # (local-ci attestation runs the same commands when the host has the tools).
  wasm:
    name: wasm
    needs: gate
    if: ${{ !cancelled() && (inputs.wasm-clippy-args != '' || inputs.wasm-test-args != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUN: ${{ needs.gate.outputs.heavy != 'false' }}
      WASM_CLIPPY_ARGS: ${{ inputs.wasm-clippy-args }}
      WASM_TEST_ARGS: ${{ inputs.wasm-test-args }}
    steps:
      - name: Skip (${{ needs.gate.outputs.mode }})
        if: env.RUN != 'true'
        env:
          MODE: ${{ needs.gate.outputs.mode }}
          REASON: ${{ needs.gate.outputs.reason }}
        run: |
          echo "Skipped - $REASON"
          echo "**Skipped by the gate** (mode \`$MODE\`): this job built and tested nothing. $REASON" >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout repository
        if: env.RUN == 'true'
        uses: actions/checkout@v7
      - name: Install Rust
        if: env.RUN == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - name: Cache dependencies
        if: env.RUN == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - name: Read wasm-bindgen version from Cargo.lock
        if: env.RUN == 'true'
        id: wasm-bindgen
        run: |
          set -euo pipefail
          [ -f Cargo.lock ] || cargo generate-lockfile
          version=$(awk '$0 == "name = \"wasm-bindgen\"" { getline; gsub(/"/, "", $3); print $3; exit }' Cargo.lock)
          [ -n "$version" ] || { echo "::error::no wasm-bindgen in Cargo.lock"; exit 1; }
          echo "wasm-bindgen $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install wasm-bindgen-cli
        if: env.RUN == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.wasm-bindgen.outputs.version }}
      - name: Set up Node.js
        if: env.RUN == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Run clippy (wasm32)
        if: env.RUN == 'true' && env.WASM_CLIPPY_ARGS != ''
        run: |
          set -euo pipefail
          while IFS= read -r args; do
            [ -n "${args//[[:space:]]/}" ] || continue
            echo "::group::cargo clippy --target wasm32-unknown-unknown $args -- -D warnings"
            # shellcheck disable=SC2086 # args is a list of flags
            cargo clippy --target wasm32-unknown-unknown $args -- -D warnings
            echo "::endgroup::"
          done <<< "$WASM_CLIPPY_ARGS"
      - name: Run tests (wasm32, Node.js)
        if: env.RUN == 'true' && env.WASM_TEST_ARGS != ''
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: |
          set -euo pipefail
          while IFS= read -r args; do
            [ -n "${args//[[:space:]]/}" ] || continue
            echo "::group::cargo test --target wasm32-unknown-unknown $args"
            # shellcheck disable=SC2086 # args is a list of flags
            cargo test --target wasm32-unknown-unknown $args
            echo "::endgroup::"
          done <<< "$WASM_TEST_ARGS"

  release-sanity:
    name: release-sanity
    needs: gate
    if: needs.gate.outputs.mode == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: cargo check ${{ inputs.features }}
      # Every publishable member, packaged together: cargo resolves their
      # dependencies on each other locally, so a release that bumps several
      # crates of one workspace (a crate and its -macros crate) packages before
      # any of them is on crates.io. `publish = false` members are left out.
      - name: cargo package (dry run)
        run: |
          set -euo pipefail
          mapfile -t private < <(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.publish == []) | .name')
          exclude=()
          for name in "${private[@]}"; do exclude+=(--exclude "$name"); done
          if [ "${#private[@]}" -gt 0 ]; then echo "Not published, left out: ${private[*]}"; fi
          cargo package --workspace "${exclude[@]}" --no-verify --allow-dirty

  # On main: an issue while CI is red, closed when it is green again. Never
  # fails CI itself.
  main-status:
    name: main-status
    needs: [fmt, clippy, test, doc, semver-checks, coverage, wasm]
    if: ${{ always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      issues: write
      actions: read
    steps:
      - name: Open, update or close the "CI is failing on main" issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          NEEDS: ${{ toJSON(needs) }}
          TITLE: CI is failing on main
        run: |
          set -uo pipefail
          warn() { echo "::warning title=main-status::$*"; exit 0; }

          failed=$(jq -r '[to_entries[] | select(.value.result == "failure") | .key] | join(", ")' <<<"$NEEDS")
          unfinished=$(jq -r '[to_entries[] | select(.value.result == "cancelled") | .key] | join(", ")' <<<"$NEEDS")

          # The open issue this job wrote earlier, if any (exact title).
          issue=$(gh issue list --repo "$REPO" --state open --search "\"$TITLE\" in:title" \
            --json number,title --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty") \
            || warn "cannot list the issues of $REPO (does the caller grant issues: write?)"

          if [ -z "$failed" ]; then
            if [ -n "$unfinished" ]; then
              echo "Cancelled jobs ($unfinished): neither red nor green, the issue is left as it is."
            elif [ -n "$issue" ]; then
              gh issue close "$issue" --repo "$REPO" \
                --comment "CI passes on main again: [run $RUN_ID]($RUN_URL), commit $SHA." \
                || warn "cannot close issue #$issue"
              echo "Closed #$issue."
            else
              echo "CI is green on main; no open issue."
            fi
            exit 0
          fi

          # The failed jobs by their check names, with links; the job ids when
          # the run's jobs cannot be read.
          jobs=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure") | "- [\(.name)](\(.html_url))"' 2>/dev/null) || jobs=""
          [ -n "$jobs" ] || jobs="- $failed"
          body=$(printf '%s\n\n%s\n\n%s\n' \
            "CI failed on \`main\` ($EVENT): [run $RUN_ID]($RUN_URL), commit $SHA." \
            "$jobs" \
            "Opened by the \`main-status\` job of the shared CI workflow; it comments here while main stays red and closes this issue at the next green run.")

          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$REPO" --body "$body" >/dev/null || warn "cannot comment on issue #$issue"
            echo "Commented on #$issue."
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$body" \
              || warn "cannot open an issue in $REPO (does the caller grant issues: write?)"
          fi
