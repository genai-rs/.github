# Canonical cargo-deny configuration for genai-rs crates.
# https://embarkstudios.github.io/cargo-deny/
#
# Repos may keep a local copy; the shared rust-security.yml workflow downloads
# this file from genai-rs/.github@main when a repo has no deny.toml of its own.

[graph]
# Check the platforms we ship/test on.
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-apple-darwin" },
]

[advisories]
# Use version 2 for stricter defaults
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Flag an unmaintained crate a workspace crate depends on directly; allow it further down, where only the
# dependency that pulls it in can replace it (cargo-deny's "transitive" would flag exactly those).
unmaintained = "workspace"
yanked = "warn"
ignore = [
    # chrono is unmaintained. The generated clients use it for `date-time` fields, in their public API, and so do
    # the crates on top of them; replacing it is a generator option and breaking releases:
    # https://github.com/timvw/openapi-generator-timvw-rust/issues/118
    { id = "RUSTSEC-2026-0543", reason = "chrono is in the generated clients' API; replacement tracked in openapi-generator-timvw-rust#118" },
]

[licenses]
# Use version 2 for stricter defaults
version = 2
# Union of the licenses the genai-rs crates need
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "OpenSSL",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    # foldhash (through hashlink, rusqlite's statement cache)
    "Zlib",
]
confidence-threshold = 0.8

[[licenses.exceptions]]
# Ring uses a custom license but is widely trusted
name = "ring"
allow = ["ISC", "MIT", "OpenSSL"]

[bans]
# Warn when multiple versions of the same crate are detected
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

# Transitive Windows crates that commonly appear in several versions
skip = [
    { name = "windows-sys" },
    { name = "windows-targets" },
    { name = "windows_x86_64_gnu" },
    { name = "windows_x86_64_msvc" },
    { name = "windows_i686_gnu" },
    { name = "windows_i686_msvc" },
    { name = "windows_aarch64_msvc" },
    { name = "windows_x86_64_gnullvm" },
    { name = "windows_aarch64_gnullvm" },
]

[sources]
# Deny crates from unknown registries
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
